# Publishes dist/MeteoAlarmAndroid-v<version>.apk as a GitHub Release, with dist/notes-v<version>.md
# as its text (the version is android:versionName in AndroidManifest.xml). v1.520 (Viorel, new
# numbering): the tag is v<versionCode>.<version> (e.g. v118.1.520), so the apps of the old
# numbering (6.10) see it as newer; the title shows only the version (Meteo Alarm Android v1.520).
# The app's "Check for updates" reads the latest Release. An existing Release is left as it is.
name: Release
on:
  push:
    branches: [main]
    paths: ['dist/**', 'AndroidManifest.xml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the APK of the manifest's version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' AndroidManifest.xml)
          CODE=$(sed -n 's/.*android:versionCode="\([^"]*\)".*/\1/p' AndroidManifest.xml)
          TAG="v$CODE.$VER"
          APK=dist/MeteoAlarmAndroid-v$VER.apk
          if [ ! -f "$APK" ]; then echo "No $APK: nothing to publish."; exit 0; fi
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG is already published."; exit 0; fi
          NOTES=dist/notes-v$VER.md
          [ -f "$NOTES" ] || NOTES=/dev/null
          gh release create "$TAG" "$APK" --title "Meteo Alarm Android v$VER" --notes-file "$NOTES"
      - name: Titles in the new numbering (vX.YZ becomes v1.(X-1)YZ; the tags stay)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 500 --json tagName,name -q '.[] | .tagName + " " + .name' | while read -r tag title; do
            if [[ "$title" =~ ^Meteo\ Alarm\ Android\ v([1-9])\.([0-9]{2})$ ]]; then
              new="Meteo Alarm Android v1.$((BASH_REMATCH[1] - 1))${BASH_REMATCH[2]}"
              gh release edit "$tag" --title "$new" && echo "$tag: $new"
            fi
          done
      - name: Keep the texts of the published Releases as in dist/notes-v*.md
        # v3.51 (Viorel): the release notes of every version follow the current rule (only new
        # functions, design changes as one line); a Release whose text differs is updated.
        # v1.520: the notes file is found by the version in the Release's title.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 500 --json tagName,name -q '.[] | .tagName + " " + .name' | while read -r tag title; do
            v=${title##* v}
            f=dist/notes-v$v.md
            [ -f "$f" ] || continue
            body=$(gh release view "$tag" --json body -q .body 2>/dev/null) || continue
            if [ "$(printf '%s' "$body" | sed -e 's/[[:space:]]*$//')" != "$(sed -e 's/[[:space:]]*$//' "$f")" ]; then
              gh release edit "$tag" --notes-file "$f" && echo "updated $tag"
            fi
          done

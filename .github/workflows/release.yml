# Publishes dist/MeteoAlarmAndroid-v<version>.apk as the GitHub Release v<version> (the version is
# android:versionName in AndroidManifest.xml), with dist/notes-v<version>.md as its text. The app's
# "Check for updates" reads the latest Release. An existing Release is left as it is.
name: Release
on:
  push:
    branches: [main]
    paths: ['dist/**', 'AndroidManifest.xml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the APK of the manifest's version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' AndroidManifest.xml)
          APK=dist/MeteoAlarmAndroid-v$VER.apk
          if [ ! -f "$APK" ]; then echo "No $APK: nothing to publish."; exit 0; fi
          if gh release view "v$VER" >/dev/null 2>&1; then echo "v$VER is already published."; exit 0; fi
          NOTES=dist/notes-v$VER.md
          [ -f "$NOTES" ] || NOTES=/dev/null
          gh release create "v$VER" "$APK" --title "Meteo Alarm Android v$VER" --notes-file "$NOTES"
      - name: Keep the texts of the published Releases as in dist/notes-v*.md
        # v3.51 (Viorel): the release notes of every version follow the current rule (only new
        # functions, design changes as one line); a Release whose text differs is updated.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in dist/notes-v*.md; do
            v=${f#dist/notes-}; v=${v%.md}
            body=$(gh release view "$v" --json body -q .body 2>/dev/null) || continue
            if [ "$(printf '%s' "$body" | sed -e 's/[[:space:]]*$//')" != "$(sed -e 's/[[:space:]]*$//' "$f")" ]; then
              gh release edit "$v" --notes-file "$f" && echo "updated $v"
            fi
          done
